name: Deploy Newman Production

on:
  workflow_dispatch:
    inputs:
      booking_cron_minutes:
        description: 'Process booking email queue every N minutes (orders are saved immediately)'
        type: choice
        default: '5'
        options:
          - '5'
          - '1'

permissions:
  contents: read

concurrency:
  group: newman-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Require production branch
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: test "$DEPLOY_REF" = refs/heads/main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify Vite build
        shell: bash
        run: |
          set -euo pipefail

          test -d public/build
          test -f public/build/manifest.json

          echo "VITE_BUILD_OK"

      - name: Verify required Newman application source
        shell: bash
        run: |
          set -euo pipefail

          test -d app
          test -d app/Http/Controllers
          test -d app/Models
          test -d resources
          test -d resources/views
          test -d config
          test -d routes
          test -d database/migrations

          test -f bootstrap/app.php
          test -f routes/web.php

          echo "NEWMAN_APPLICATION_SOURCE_OK"

      - name: Prepare production deployment package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf deploy-package
          mkdir -p deploy-package

          echo "Packaging Laravel application code..."
          cp -a app deploy-package/app

          echo "Packaging frontend resources..."
          cp -a resources deploy-package/resources

          echo "Packaging Laravel configuration..."
          cp -a config deploy-package/config

          echo "Packaging Laravel routes..."
          cp -a routes deploy-package/routes

          echo "Packaging Laravel bootstrap files..."
          mkdir -p deploy-package/bootstrap
          cp bootstrap/app.php deploy-package/bootstrap/app.php

          if [ -f bootstrap/providers.php ]; then
            cp bootstrap/providers.php deploy-package/bootstrap/providers.php
          fi

          echo "Packaging translation files when present..."
          if [ -d lang ]; then
            cp -a lang deploy-package/lang
          fi

          echo "Packaging database migration SOURCE FILES only..."
          echo "Only the reviewed booking protection migration will run after database backup."
          mkdir -p deploy-package/database
          cp -a database/migrations deploy-package/database/migrations
          cp .github/scripts/production-booking.php deploy-package/production-booking.php

          echo "Packaging Vite build..."
          cp -a public/build deploy-package/build

          echo "Packaging safe public assets..."
          tar \
            --exclude='public/index.php' \
            --exclude='public/.htaccess' \
            --exclude='public/storage' \
            --exclude='public/build' \
            -czf deploy-package/public-static.tar.gz \
            public

          echo "Creating deployment archive..."
          tar \
            -czf newman-production-deploy.tar.gz \
            deploy-package

          test -f newman-production-deploy.tar.gz

          echo "DEPLOYMENT_PACKAGE_OK"

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "${{ secrets.CPANEL_SSH_PRIVATE_KEY }}" \
            | base64 --decode \
            > ~/.ssh/newman_deploy_key

          chmod 600 ~/.ssh/newman_deploy_key

          ssh-keygen -y \
            -f ~/.ssh/newman_deploy_key \
            > /dev/null

          ssh-keyscan \
            -p "${{ secrets.CPANEL_SSH_PORT }}" \
            "${{ secrets.CPANEL_SSH_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          echo "SSH_CONFIGURATION_OK"

      - name: Upload deployment package
        shell: bash
        run: |
          set -euo pipefail

          scp \
            -o BatchMode=yes \
            -i ~/.ssh/newman_deploy_key \
            -P "${{ secrets.CPANEL_SSH_PORT }}" \
            newman-production-deploy.tar.gz \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:/home/${{ secrets.CPANEL_SSH_USER }}/newman-production-deploy.tar.gz"

          echo "UPLOAD_OK"

      - name: Deploy Newman production safely
        shell: bash
        env:
          BOOKING_CRON_MINUTES: ${{ inputs.booking_cron_minutes }}
        run: |
          set -euo pipefail
          case "$BOOKING_CRON_MINUTES" in
            1|5) ;;
            *) echo "Invalid notification cron interval"; exit 1 ;;
          esac

          ssh \
            -o BatchMode=yes \
            -i ~/.ssh/newman_deploy_key \
            -p "${{ secrets.CPANEL_SSH_PORT }}" \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}" \
            "bash -s -- '$BOOKING_CRON_MINUTES'" <<'REMOTE_SCRIPT'

          set -Eeuo pipefail

          HOME_DIR="$HOME"
          APP_DIR="$HOME_DIR/laravel-core"
          WEB_DIR="$HOME_DIR/public_html"
          PACKAGE="$HOME_DIR/newman-production-deploy.tar.gz"

          TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
          RELEASE_DIR="$HOME_DIR/.newman-deploy-$TIMESTAMP"
          BACKUP_DIR="$HOME_DIR/backups/newman-production-$TIMESTAMP"

          DEPLOY_STARTED=0
          MAINTENANCE_STARTED=0
          CRON_CHANGED=0
          BOOKING_CRON_MINUTES="$1"
          PHP_BIN="$(php -r 'echo PHP_BINARY;')"
          DUMP_BIN="$(command -v mysqldump)"

          restore_directory() {
            local backup_path="$1"
            local destination="$2"

            if [ -d "$backup_path" ]; then
              rm -rf "$destination"
              mkdir -p "$(dirname "$destination")"
              cp -a "$backup_path" "$destination"
            fi
          }

          rollback() {
            local exit_code=$?

            trap - ERR
            set +e
            ROLLBACK_FAILED=0

            if [ "$DEPLOY_STARTED" -eq 1 ]; then
              echo "=========================================="
              echo "DEPLOYMENT_FAILED_ROLLING_BACK"
              echo "=========================================="

              restore_directory "$BACKUP_DIR/app" "$APP_DIR/app" || ROLLBACK_FAILED=1
              restore_directory "$BACKUP_DIR/resources" "$APP_DIR/resources" || ROLLBACK_FAILED=1
              restore_directory "$BACKUP_DIR/config" "$APP_DIR/config" || ROLLBACK_FAILED=1
              restore_directory "$BACKUP_DIR/routes" "$APP_DIR/routes" || ROLLBACK_FAILED=1

              cp -a "$BACKUP_DIR/production.env" "$APP_DIR/.env" || ROLLBACK_FAILED=1
              if [ "$CRON_CHANGED" -eq 1 ]; then
                crontab "$BACKUP_DIR/crontab.before" || ROLLBACK_FAILED=1
              fi

              if [ -d "$BACKUP_DIR/lang" ]; then
                restore_directory "$BACKUP_DIR/lang" "$APP_DIR/lang" || ROLLBACK_FAILED=1
              fi

              if [ -d "$BACKUP_DIR/database/migrations" ]; then
                rm -rf "$APP_DIR/database/migrations"
                mkdir -p "$APP_DIR/database"
                cp -a \
                  "$BACKUP_DIR/database/migrations" \
                  "$APP_DIR/database/migrations" || ROLLBACK_FAILED=1
              fi

              if [ -f "$BACKUP_DIR/bootstrap/app.php" ]; then
                cp -a \
                  "$BACKUP_DIR/bootstrap/app.php" \
                  "$APP_DIR/bootstrap/app.php" || ROLLBACK_FAILED=1
              fi

              if [ -f "$BACKUP_DIR/bootstrap/providers.php" ]; then
                cp -a \
                  "$BACKUP_DIR/bootstrap/providers.php" \
                  "$APP_DIR/bootstrap/providers.php" || ROLLBACK_FAILED=1
              fi

              if [ -d "$BACKUP_DIR/laravel-public-build" ]; then
                rm -rf "$APP_DIR/public/build"
                cp -a \
                  "$BACKUP_DIR/laravel-public-build" \
                  "$APP_DIR/public/build" || ROLLBACK_FAILED=1
              fi

              if [ -d "$BACKUP_DIR/public-html-build" ]; then
                rm -rf "$WEB_DIR/build"
                cp -a \
                  "$BACKUP_DIR/public-html-build" \
                  "$WEB_DIR/build" || ROLLBACK_FAILED=1
              fi

              php "$APP_DIR/artisan" optimize:clear >/dev/null 2>&1 || ROLLBACK_FAILED=1

              echo "Database backup is retained; additive schema changes are not reversed automatically."
              echo "Restored from: $BACKUP_DIR"
            fi

            if [ "$MAINTENANCE_STARTED" -eq 1 ] && [ "$ROLLBACK_FAILED" -eq 0 ]; then
              "$PHP_BIN" "$APP_DIR/artisan" up || ROLLBACK_FAILED=1
            fi
            if [ "$ROLLBACK_FAILED" -eq 0 ]; then
              echo "ROLLBACK_OK"
            else
              echo "ROLLBACK_REQUIRES_MANUAL_CHECK; maintenance mode retained when possible."
            fi

            rm -f "$BACKUP_DIR/mysql-client.cnf"
            rm -rf "$RELEASE_DIR"
            rm -f "$PACKAGE"

            exit "$exit_code"
          }

          trap rollback ERR

          replace_directory() {
            local source="$1"
            local destination="$2"
            local new_dir="${destination}.new"
            local old_dir="${destination}.old"

            rm -rf "$new_dir" "$old_dir"
            mkdir -p "$new_dir"

            cp -a "$source/." "$new_dir/"

            if [ -d "$destination" ]; then
              mv "$destination" "$old_dir"
            fi

            mv "$new_dir" "$destination"
            rm -rf "$old_dir"
          }

          echo "=========================================="
          echo "NEWMAN PRODUCTION DEPLOYMENT"
          echo "=========================================="

          echo "Checking production directories..."

          test -d "$APP_DIR"
          test -d "$WEB_DIR"
          test -f "$APP_DIR/artisan"
          test -f "$APP_DIR/.env"
          test -f "$WEB_DIR/index.php"
          test -f "$PACKAGE"

          echo "Production directories verified."

          echo "Creating deployment workspace..."

          mkdir -p "$RELEASE_DIR"
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$RELEASE_DIR"
          chmod 700 "$BACKUP_DIR"

          echo "Extracting deployment archive..."

          tar \
            -xzf "$PACKAGE" \
            -C "$RELEASE_DIR"

          test -d "$RELEASE_DIR/deploy-package"
          test -d "$RELEASE_DIR/deploy-package/app"
          test -d "$RELEASE_DIR/deploy-package/resources"
          test -d "$RELEASE_DIR/deploy-package/config"
          test -d "$RELEASE_DIR/deploy-package/routes"
          test -d "$RELEASE_DIR/deploy-package/database/migrations"
          test -d "$RELEASE_DIR/deploy-package/build"

          test -f "$RELEASE_DIR/deploy-package/bootstrap/app.php"
          test -f "$RELEASE_DIR/deploy-package/routes/web.php"
          test -f "$RELEASE_DIR/deploy-package/build/manifest.json"
          test -f "$RELEASE_DIR/deploy-package/production-booking.php"

          echo "PACKAGE_EXTRACTION_OK"
          "$PHP_BIN" "$RELEASE_DIR/deploy-package/production-booking.php" "$APP_DIR" preflight
          command -v crontab >/dev/null

          echo "Creating safety backup..."

          cp -a "$APP_DIR/app" "$BACKUP_DIR/app"
          cp -a "$APP_DIR/resources" "$BACKUP_DIR/resources"
          cp -a "$APP_DIR/config" "$BACKUP_DIR/config"
          cp -a "$APP_DIR/routes" "$BACKUP_DIR/routes"
          cp -a "$APP_DIR/.env" "$BACKUP_DIR/production.env"
          chmod 600 "$BACKUP_DIR/production.env"

          if ! crontab -l > "$BACKUP_DIR/crontab.before" 2> "$BACKUP_DIR/crontab-read-errors.log"; then
            grep -qi 'no crontab' "$BACKUP_DIR/crontab-read-errors.log"
            : > "$BACKUP_DIR/crontab.before"
          fi

          if [ -d "$APP_DIR/lang" ]; then
            cp -a "$APP_DIR/lang" "$BACKUP_DIR/lang"
          fi

          if [ -d "$APP_DIR/database/migrations" ]; then
            mkdir -p "$BACKUP_DIR/database"
            cp -a \
              "$APP_DIR/database/migrations" \
              "$BACKUP_DIR/database/migrations"
          fi

          mkdir -p "$BACKUP_DIR/bootstrap"
          cp -a \
            "$APP_DIR/bootstrap/app.php" \
            "$BACKUP_DIR/bootstrap/app.php"

          if [ -f "$APP_DIR/bootstrap/providers.php" ]; then
            cp -a \
              "$APP_DIR/bootstrap/providers.php" \
              "$BACKUP_DIR/bootstrap/providers.php"
          fi

          if [ -d "$APP_DIR/public/build" ]; then
            cp -a \
              "$APP_DIR/public/build" \
              "$BACKUP_DIR/laravel-public-build"
          fi

          if [ -d "$WEB_DIR/build" ]; then
            cp -a \
              "$WEB_DIR/build" \
              "$BACKUP_DIR/public-html-build"
          fi

          echo "BACKUP_OK"
          echo "Backup directory: $BACKUP_DIR"

          "$PHP_BIN" "$APP_DIR/artisan" down --retry=60
          MAINTENANCE_STARTED=1
          "$PHP_BIN" "$RELEASE_DIR/deploy-package/production-booking.php" "$APP_DIR" prepare-backup "$BACKUP_DIR"
          DATABASE_NAME="$(cat "$BACKUP_DIR/database-name.txt")"
          "$DUMP_BIN" --defaults-extra-file="$BACKUP_DIR/mysql-client.cnf" \
            --single-transaction --quick --skip-lock-tables --no-tablespaces --hex-blob \
            "$DATABASE_NAME" > "$BACKUP_DIR/database.sql" 2> "$BACKUP_DIR/database-backup-errors.log"
          rm -f "$BACKUP_DIR/mysql-client.cnf"
          test -s "$BACKUP_DIR/database.sql"
          chmod 600 "$BACKUP_DIR/database.sql"
          gzip "$BACKUP_DIR/database.sql"
          gzip -t "$BACKUP_DIR/database.sql.gz"
          echo "DATABASE_BACKUP_OK"

          DEPLOY_STARTED=1
          "$PHP_BIN" "$RELEASE_DIR/deploy-package/production-booking.php" "$APP_DIR" normalize-url

          echo "Deploying Laravel application code..."
          replace_directory \
            "$RELEASE_DIR/deploy-package/app" \
            "$APP_DIR/app"

          echo "Deploying frontend resources..."
          replace_directory \
            "$RELEASE_DIR/deploy-package/resources" \
            "$APP_DIR/resources"

          echo "Deploying Laravel configuration..."
          replace_directory \
            "$RELEASE_DIR/deploy-package/config" \
            "$APP_DIR/config"

          echo "Deploying Laravel routes..."
          replace_directory \
            "$RELEASE_DIR/deploy-package/routes" \
            "$APP_DIR/routes"

          echo "Deploying Laravel bootstrap..."
          cp -a \
            "$RELEASE_DIR/deploy-package/bootstrap/app.php" \
            "$APP_DIR/bootstrap/app.php"

          if [ -f "$RELEASE_DIR/deploy-package/bootstrap/providers.php" ]; then
            cp -a \
              "$RELEASE_DIR/deploy-package/bootstrap/providers.php" \
              "$APP_DIR/bootstrap/providers.php"
          fi

          if [ -d "$RELEASE_DIR/deploy-package/lang" ]; then
            echo "Deploying translation files..."
            replace_directory \
              "$RELEASE_DIR/deploy-package/lang" \
              "$APP_DIR/lang"
          fi

          echo "Deploying migration source files only..."
          echo "Only the booking protection migration will be applied in the maintenance window."

          mkdir -p "$APP_DIR/database/migrations"
          cp -a \
            "$RELEASE_DIR/deploy-package/database/migrations/." \
            "$APP_DIR/database/migrations/"

          echo "Replacing Laravel Vite build..."

          rm -rf "$APP_DIR/public/build.new"
          mkdir -p "$APP_DIR/public/build.new"

          cp -a \
            "$RELEASE_DIR/deploy-package/build/." \
            "$APP_DIR/public/build.new/"

          test -f "$APP_DIR/public/build.new/manifest.json"

          rm -rf "$APP_DIR/public/build.old"

          if [ -d "$APP_DIR/public/build" ]; then
            mv \
              "$APP_DIR/public/build" \
              "$APP_DIR/public/build.old"
          fi

          mv \
            "$APP_DIR/public/build.new" \
            "$APP_DIR/public/build"

          rm -rf "$APP_DIR/public/build.old"

          echo "Replacing public_html Vite build..."

          rm -rf "$WEB_DIR/build.new"
          mkdir -p "$WEB_DIR/build.new"

          cp -a \
            "$RELEASE_DIR/deploy-package/build/." \
            "$WEB_DIR/build.new/"

          test -f "$WEB_DIR/build.new/manifest.json"

          rm -rf "$WEB_DIR/build.old"

          if [ -d "$WEB_DIR/build" ]; then
            mv \
              "$WEB_DIR/build" \
              "$WEB_DIR/build.old"
          fi

          mv \
            "$WEB_DIR/build.new" \
            "$WEB_DIR/build"

          rm -rf "$WEB_DIR/build.old"

          echo "Updating safe public static assets..."

          mkdir -p "$RELEASE_DIR/public-static"

          tar \
            -xzf "$RELEASE_DIR/deploy-package/public-static.tar.gz" \
            -C "$RELEASE_DIR/public-static"

          if [ -d "$RELEASE_DIR/public-static/public" ]; then
            cp -a \
              "$RELEASE_DIR/public-static/public/." \
              "$WEB_DIR/"
          fi

          echo "Clearing Laravel runtime caches..."

          php "$APP_DIR/artisan" optimize:clear
          cd "$APP_DIR"
          "$PHP_BIN" artisan migrate \
            --path=database/migrations/2026_10_13_100000_add_booking_submission_protection.php \
            --force
          "$PHP_BIN" "$RELEASE_DIR/deploy-package/production-booking.php" "$APP_DIR" validate "$BACKUP_DIR"
          "$PHP_BIN" artisan config:cache
          "$PHP_BIN" artisan view:cache
          "$PHP_BIN" artisan queue:restart

          touch "$HOME_DIR/booking-notifications-cron.log"
          chmod 600 "$HOME_DIR/booking-notifications-cron.log"
          if ! grep -Eq '^[[:space:]]*[^#[:space:]].*booking-notifications:work' "$BACKUP_DIR/crontab.before"; then
            cp "$BACKUP_DIR/crontab.before" "$BACKUP_DIR/crontab.new"
            if [ "$BOOKING_CRON_MINUTES" = 1 ]; then
              CRON_MINUTE='*'
            else
              CRON_MINUTE='*/5'
            fi
            printf '\n# Newman booking notification queue\n' >> "$BACKUP_DIR/crontab.new"
            printf '%s * * * * cd %q && %q artisan booking-notifications:work --max-time=50 >> %q 2>&1\n' \
              "$CRON_MINUTE" "$APP_DIR" "$PHP_BIN" "$HOME_DIR/booking-notifications-cron.log" \
              >> "$BACKUP_DIR/crontab.new"
            CRON_CHANGED=1
            crontab "$BACKUP_DIR/crontab.new"
          fi
          crontab -l | grep -Eq '^[[:space:]]*[^#[:space:]].*booking-notifications:work'
          echo "BOOKING_NOTIFICATION_CRON_OK"

          echo "Validating protected production files..."

          test -f "$APP_DIR/.env"
          test -f "$APP_DIR/artisan"
          test -f "$WEB_DIR/index.php"

          echo "Validating deployed application source..."

          test -d "$APP_DIR/app/Http/Controllers"
          test -d "$APP_DIR/app/Models"
          test -d "$APP_DIR/resources/views"
          test -d "$APP_DIR/config"
          test -d "$APP_DIR/routes"

          test -f "$APP_DIR/bootstrap/app.php"
          test -f "$APP_DIR/routes/web.php"

          test -f "$APP_DIR/public/build/manifest.json"
          test -f "$WEB_DIR/build/manifest.json"

          echo "Validating Laravel application boot..."

          php "$APP_DIR/artisan" about > /dev/null

          echo "LARAVEL_BOOT_OK"

          echo "Validating Laravel route registration..."

          php "$APP_DIR/artisan" route:list \
            > "$RELEASE_DIR/route-list.txt"

          test -s "$RELEASE_DIR/route-list.txt"

          echo "ROUTE_REGISTRATION_OK"

          if [ -f "$APP_DIR/app/Http/Controllers/Admin/AdminRatingController.php" ]; then
            echo "Validating Admin Ratings routes..."

            grep -q "admin.ratings.index" \
              "$RELEASE_DIR/route-list.txt"

            grep -q "admin.ratings.show" \
              "$RELEASE_DIR/route-list.txt"

            echo "ADMIN_RATINGS_ROUTES_OK"
          fi

          echo "Reviewed booking migration applied; all other migrations are left untouched."
          "$PHP_BIN" artisan up
          MAINTENANCE_STARTED=0

          echo "Cleaning temporary deployment files..."

          trap - ERR
          DEPLOY_STARTED=0

          rm -rf "$RELEASE_DIR"
          rm -f "$PACKAGE"

          echo "=========================================="
          echo "NEWMAN_PRODUCTION_DEPLOYMENT_OK"
          echo "Backup: $BACKUP_DIR"
          echo "=========================================="

          REMOTE_SCRIPT
