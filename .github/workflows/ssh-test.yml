name: Test cPanel SSH Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "${{ secrets.CPANEL_SSH_PRIVATE_KEY }}" \
            | base64 --decode \
            > ~/.ssh/newman_deploy_key

          chmod 600 ~/.ssh/newman_deploy_key

          ssh-keygen -y \
            -f ~/.ssh/newman_deploy_key \
            > /dev/null

          echo "SSH private key decoded successfully"

      - name: Add cPanel host
        shell: bash
        run: |
          set -e

          ssh-keyscan \
            -p "${{ secrets.CPANEL_SSH_PORT }}" \
            "${{ secrets.CPANEL_SSH_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Test cPanel SSH connection
        shell: bash
        run: |
          set -e

          ssh \
            -o BatchMode=yes \
            -i ~/.ssh/newman_deploy_key \
            -p "${{ secrets.CPANEL_SSH_PORT }}" \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}" \
            'echo "SSH_CONNECTION_OK" && whoami && hostname && pwd'

      - name: Inspect booking deployment prerequisites without changing production
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -i ~/.ssh/newman_deploy_key \
            -p "${{ secrets.CPANEL_SSH_PORT }}" \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}" \
            'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$HOME/laravel-core"
          test -f artisan
          test -f vendor/autoload.php
          echo "BOOKING_DEPLOYMENT_PREFLIGHT"
          php <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';
          $app = require getcwd().'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $columns = ['submission_key', 'submission_hash', 'admin_notification_pending', 'admin_notification_queued_at', 'admin_notified_at'];
          $tables = [];
          foreach (['bookings', 'tour_booking_requests', 'jobs', 'failed_jobs', 'cache', 'cache_locks', 'migrations'] as $table) {
              $tables[$table] = Illuminate\Support\Facades\Schema::hasTable($table);
          }
          $schema = [];
          foreach (['bookings', 'tour_booking_requests'] as $table) {
              $schema[$table] = [];
              foreach ($columns as $column) {
                  $schema[$table][$column] = $tables[$table] && Illuminate\Support\Facades\Schema::hasColumn($table, $column);
              }
          }
          $recipient = config('newman.booking_notification_email');
          echo json_encode([
              'php_version' => PHP_VERSION,
              'php_binary' => PHP_BINARY,
              'pcntl_available' => function_exists('pcntl_alarm'),
              'app_url' => config('app.url'),
              'database_driver' => config('database.connections.'.config('database.default').'.driver'),
              'cache_store' => config('cache.default'),
              'cache_driver' => config('cache.stores.'.config('cache.default').'.driver'),
              'mail_transport' => config('mail.mailers.'.config('mail.default').'.transport'),
              'booking_recipient_configured' => is_string($recipient) && trim($recipient) !== '',
              'maintenance_mode' => $app->isDownForMaintenance(),
              'tables' => $tables,
              'booking_columns' => $schema,
              'booking_migration_applied' => $tables['migrations'] && Illuminate\Support\Facades\DB::table('migrations')->where('migration', '2026_10_13_100000_add_booking_submission_protection')->exists(),
              'queued_booking_notifications' => $tables['jobs'] ? Illuminate\Support\Facades\DB::table('jobs')->where('queue', 'booking-notifications')->count() : null,
              'failed_booking_notifications' => $tables['failed_jobs'] ? Illuminate\Support\Facades\DB::table('failed_jobs')->where('queue', 'booking-notifications')->count() : null,
          ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES).PHP_EOL;
          PHP
          if command -v mysqldump >/dev/null 2>&1; then
            echo "MYSQLDUMP_AVAILABLE=yes"
          else
            echo "MYSQLDUMP_AVAILABLE=no"
          fi
          if command -v crontab >/dev/null 2>&1; then
            echo "CRONTAB_AVAILABLE=yes"
            cron_count="$(crontab -l 2>/dev/null | awk '/^[[:space:]]*#/ {next} /booking-notifications:work/ {count++} END {print count+0}' || true)"
            echo "BOOKING_CRON_ENTRIES=${cron_count:-0}"
            crontab -l 2>/dev/null | awk '/^[[:space:]]*#/ {next} /booking-notifications:work/ {print "BOOKING_CRON_MINUTE_FIELD=" $1}' || true
          else
            echo "CRONTAB_AVAILABLE=no"
          fi
          if [ -f "$HOME/booking-notifications-cron.log" ]; then
            cron_runs="$(grep -c '^Pending booking notifications checked\.' "$HOME/booking-notifications-cron.log" || true)"
            echo "BOOKING_CRON_COMPLETED_RECOVERY_RUNS=${cron_runs:-0}"
          fi
          echo "BOOKING_DEPLOYMENT_PREFLIGHT_OK"
          REMOTE_SCRIPT
